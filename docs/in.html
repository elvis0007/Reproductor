<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para el amor de mi vida 💕</title>
    <link rel="stylesheet" type="text/css" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="src/theme.css">
    <link rel="stylesheet" type="text/css" href="src/style.css">
    <link rel="shortcut icon" href="./assets/Corazon.png" type="image/x-icon">
</head>
<body>

    <div class="hearts-bg" id="heartsBg"></div>

    <div class="app">

        <header class="app-header">
            <h1 class="brand brand-title">Para el amor de mi vida  <span class="heart-pulse">♥</span></h1>
            <p class="tagline">....</p>
        </header>

     

        <main class="layout">

            <section class="player-card">
                <div class="video-frame">
                    <div id="yt-player"></div>
                </div>

                <div class="now-playing">
                    <p class="np-label">....</p>
                    <h2 class="np-title" id="npTitle">Cargando...</h2>
                    <p class="np-artist">Rels B</p>
                </div>

                <div class="progress-row">
                    <span class="time" id="currentTime">0:00</span>
                    <input type="range" id="seekBar" class="seek" min="0" max="100" value="0" step="0.1">
                    <span class="time" id="durationTime">0:00</span>
                </div>

                <div class="controls">
                    <button class="ctrl-btn" id="shuffleBtn" title="Aleatorio"><i class="fa fa-random"></i></button>
                    <button class="ctrl-btn" id="prevBtn" title="Anterior"><i class="fa fa-step-backward"></i></button>
                    <button class="ctrl-btn play-btn" id="playBtn" title="Reproducir"><i class="fa fa-play"></i></button>
                    <button class="ctrl-btn" id="nextBtn" title="Siguiente"><i class="fa fa-step-forward"></i></button>
                    <button class="ctrl-btn" id="repeatBtn" title="Repetir"><i class="fa fa-repeat"></i></button>
                </div>

                <div class="volume-row">
                    <i class="fa fa-volume-up"></i>
                    <input type="range" id="volumeBar" class="volume" min="0" max="100" value="80">
                </div>
            </section>

            <aside class="playlist-card">
                <h3 class="playlist-title"><i class="fa fa-music"></i> Canciones para tí <span class="playlist-count" id="playlistCount"></span></h3>
                <ul class="playlist" id="playlist"></ul>
            </aside>

        </main>

        <footer class="footer">
            <p>Para la niña más bonita <span class="heart-pulse">♥</span></p>
        </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script src="src/hearts.js"></script>
    <script src="src/script.js"></script>
</body>
</html>
